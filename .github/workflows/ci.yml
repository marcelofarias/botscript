name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build the published packages first so the cli's bin link is resolved
      # before examples (which exec `botscript`) start.
      - run: pnpm -r --filter './packages/*' build
      - run: pnpm -r --filter './examples/*' build
      - run: pnpm test
      - run: pnpm --filter node-app test
      - run: pnpm --filter react-app build
