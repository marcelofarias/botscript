<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>botscript · todo</title>
    <style>
      :root { color-scheme: dark; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: #0e1014; color: #e8e8e8;
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
      }
      main { width: min(560px, 92vw); padding: 32px 0; }
      h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: -0.02em; }
      .sub { color: #8a8f98; margin: 0 0 24px; font-size: 14px; }
      form { display: flex; gap: 8px; margin-bottom: 16px; }
      input, button {
        font: inherit; padding: 10px 14px; border-radius: 8px;
        border: 1px solid #2a2f3a; background: #16191f; color: inherit;
      }
      input { flex: 1; }
      button { cursor: pointer; }
      button:hover { background: #1f242d; }
      ul { list-style: none; padding: 0; margin: 0; }
      li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; }
      li:hover { background: #16191f; }
      li.done span { text-decoration: line-through; color: #6a6f78; }
      .meta { color: #6a6f78; font-size: 12px; font-family: ui-monospace, monospace; }
      .empty { color: #6a6f78; font-style: italic; padding: 24px 0; text-align: center; }
    </style>
  </head>
  <body>
    <main>
      <div id="root"></div>
    </main>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
